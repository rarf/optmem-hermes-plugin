[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optmem-hermes-plugin"
version = "0.3.1"
description = "OptMem local memory provider for Hermes Agent — append-only, decay-compressed, BM25 search, Hybrid/OptMem-only modes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "OptMem Hermes Plugin contributors" }]
keywords = ["hermes", "hermes-agent", "memory", "optmem", "agent-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# No runtime dependency beyond the stdlib by default. PyYAML is imported lazily
# and only for the legacy `plugins.optmem` config fallback + CLI config writes;
# the declared-schema config (the supported path) is plain JSON.
dependencies = []

[project.optional-dependencies]
# `legacy-config` is an installable optional dependency, so it follows the
# catalog's supply-chain policy (plugin-catalog/README.md rule 9): an oldest
# verified floor PLUS a `<next_major` upper bound. PyYAML is a 6.x line, so the
# ceiling is `<7`. Only needed for the 0.2.0 `plugins.optmem` YAML fallback and
# CLI config writes; the supported declared-schema path is plain JSON.
legacy-config = ["pyyaml>=6.0,<7"]
# dev/build tooling follows a separate (contributor-only) policy; these are not
# part of the shipped runtime surface.
dev = [
    "pyyaml>=6.0",
    "setuptools>=77.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
]

[project.urls]
Homepage = "https://github.com/rarf/optmem-hermes-plugin"
Repository = "https://github.com/rarf/optmem-hermes-plugin"
Issues = "https://github.com/rarf/optmem-hermes-plugin/issues"
Changelog = "https://github.com/rarf/optmem-hermes-plugin/blob/main/CHANGELOG.md"

# The memory-provider entry point group Hermes actually scans
# (plugins/memory/__init__.py: ENTRY_POINTS_GROUP). The key is the canonical
# registered provider name (`memory.provider: optmem-hermes`), NOT the bare
# upstream project key; the value is the Python package, which keeps its name.
# The old 0.2.0 entry used "hermes.plugins", which Hermes never reads for memory
# providers — and a directory package declared via py-modules shipped an EMPTY
# wheel.
[project.entry-points."hermes_agent.memory_providers"]
optmem-hermes = "optmem"

[tool.setuptools]
packages = ["optmem"]

[tool.setuptools.package-data]
optmem = ["plugin.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
lint.ignore = ["S101"]  # assert used in tests

# CLI demo scripts may use print freely.
[tool.ruff.lint.per-file-ignores]
"examples/**" = ["T201"]
