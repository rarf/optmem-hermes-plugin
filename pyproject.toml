[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optmem-hermes-plugin"
version = "0.2.0"
description = "OptMem local memory provider for Hermes Agent — append-only, decay-compressed, BM25 search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OptMem Hermes Plugin contributors" }]
keywords = ["hermes", "hermes-agent", "memory", "optmem", "agent-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml",  # already a Hermes dependency; listed for standalone installs
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
]

[project.urls]
Homepage = "https://github.com/rarf/optmem-hermes-plugin"
Repository = "https://github.com/rarf/optmem-hermes-plugin"
Issues = "https://github.com/rarf/optmem-hermes-plugin/issues"
Changelog = "https://github.com/rarf/optmem-hermes-plugin/blob/main/CHANGELOG.md"

# Hermes discovers standalone memory plugins via directory scan
# ($HERMES_HOME/plugins/<name>/) and via this entry point group.
[project.entry-points."hermes.plugins"]
optmem = "optmem"

[tool.setuptools]
py-modules = ["optmem"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
lint.ignore = ["S101"]  # assert used in tests

# CLI demo scripts may use print freely.
[tool.ruff.lint.per-file-ignores]
"examples/**" = ["T201"]
