name: optmem-hermes
repo: https://github.com/rarf/optmem-hermes-plugin
sha: 1cae50030eb9651063d9f97ed2a0b3892e189811
subdir: optmem
description: >-
  Independent Hermes integration of Victor Taelin's OptMem design: local,
  append-only memory with regex/BM25 recall and a bounded wake digest.
  Hybrid and guarded OptMem-only modes; verified migration and rollback.
  Local by default. Compaction is manual unless `auto_nap` is enabled.
  Optional LLM summaries run only when both `auto_nap` and `llm_summary` are
  on; they send memory blocks to the configured provider via host-owned
  authentication and may incur token costs. Summaries are lossy,
  raw records remain recoverable, and conflicts are not resolved automatically.
  Wake consumes model context. See README for upstream attribution.
maintainer: rarf
tier: community
